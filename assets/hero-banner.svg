<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#292e42"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="window">
      <rect x="0" y="0" width="1200" height="340" rx="14"/>
    </clipPath>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <!-- window body -->
    <rect width="1200" height="340" fill="#1a1b26"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1200" height="40" fill="#16161e"/>
    <circle cx="24" cy="20" r="6.5" fill="#f7768e"/>
    <circle cx="46" cy="20" r="6.5" fill="#e0af68"/>
    <circle cx="68" cy="20" r="6.5" fill="#9ece6a"/>
    <text x="600" y="25" text-anchor="middle" font-size="13" fill="#565f89">EliitmeVN@hanoi: ~</text>

    <!-- prompt + identity -->
    <text x="56" y="98" font-size="18" fill="#565f89"><tspan fill="#9ece6a">EliitmeVN@hanoi</tspan>:<tspan fill="#7aa2f7">~</tspan>$ <tspan fill="#a9b1d6">whoami</tspan></text>
    <text x="54" y="170" font-size="60" font-weight="700" fill="url(#accent)">Lê Văn Long</text>
    <text x="56" y="212" font-size="22" fill="#c0caf5">fullstack engineer <tspan fill="#565f89">@</tspan> Eastgate Software</text>
    <text x="56" y="246" font-size="16" fill="#9aa5ce">
      <tspan fill="#bb9af7">web</tspan> · <tspan fill="#7dcfff">infrastructure</tspan> · <tspan fill="#e0af68">ai tooling</tspan> · <tspan fill="#9ece6a">homelab</tspan>
    </text>
    <text x="56" y="298" font-size="18" fill="#565f89"><tspan fill="#9ece6a">EliitmeVN@hanoi</tspan>:<tspan fill="#7aa2f7">~</tspan>$ <tspan class="cursor" fill="#c0caf5">█</tspan></text>

    <!-- decorative code glyph -->
    <text x="1010" y="236" text-anchor="middle" font-size="150" font-weight="700" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55">&lt;/&gt;</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#292e42"/>
</svg>
